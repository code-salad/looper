name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  detect:
    name: Detect changed crates
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      looper-watch: ${{ steps.changes.outputs.looper-watch }}
      fallback-agent: ${{ steps.changes.outputs.fallback-agent }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes since last release tag
        id: changes
        run: |
          # Find the previous tag (skip current)
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p')

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found — building all crates"
            echo "looper-watch=true" >> "$GITHUB_OUTPUT"
            echo "fallback-agent=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Comparing $PREV_TAG..HEAD"
          CHANGED=$(git diff --name-only "$PREV_TAG"..HEAD)
          echo "$CHANGED"

          LW=false
          FA=false

          if echo "$CHANGED" | grep -qE '^crates/looper-watch/|^Cargo\.lock$|^Cargo\.toml$'; then
            LW=true
          fi

          if echo "$CHANGED" | grep -qE '^crates/fallback-agent/|^Cargo\.lock$|^Cargo\.toml$'; then
            FA=true
          fi

          echo "looper-watch=$LW" >> "$GITHUB_OUTPUT"
          echo "fallback-agent=$FA" >> "$GITHUB_OUTPUT"

  build-looper-watch:
    name: Build looper-watch
    needs: detect
    if: needs.detect.outputs.looper-watch == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        working-directory: crates/looper-watch
        run: cargo build --release
      - name: Package
        run: |
          cd crates/looper-watch/target/release
          tar czf "$GITHUB_WORKSPACE/looper-watch-x86_64-linux.tar.gz" looper-watch
      - uses: actions/upload-artifact@v4
        with:
          name: looper-watch-x86_64-linux
          path: looper-watch-x86_64-linux.tar.gz
          if-no-files-found: error

  build-fallback-agent:
    name: Build fallback-agent
    needs: detect
    if: needs.detect.outputs.fallback-agent == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        working-directory: crates/fallback-agent
        run: cargo build --release
      - name: Package
        run: |
          cd crates/fallback-agent/target/release
          tar czf "$GITHUB_WORKSPACE/fallback-agent-x86_64-linux.tar.gz" fallback-agent
      - uses: actions/upload-artifact@v4
        with:
          name: fallback-agent-x86_64-linux
          path: fallback-agent-x86_64-linux.tar.gz
          if-no-files-found: error

  build-sandbox-image:
    name: Build + Push Sandbox Image
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: plugins/looper/sandbox
          file: plugins/looper/sandbox/Dockerfile
          push: true
          tags: |
            ghcr.io/code-salad/looper-sandbox:latest
            ghcr.io/code-salad/looper-sandbox:${{ steps.version.outputs.tag }}
          build-args: |
            LOOPER_REF=${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create Release
    needs: [detect, build-looper-watch, build-fallback-agent]
    if: always() && !failure() && !cancelled()
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
