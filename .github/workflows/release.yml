name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.crate }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        crate:
          - looper-watch
          - fallback-agent

        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
        include:
          # OS mapping
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: x86_64-linux
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: aarch64-linux
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: x86_64-macos
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: aarch64-macos

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (aarch64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        working-directory: crates/${{ matrix.crate }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          ARCHIVE="${{ matrix.crate }}-${{ matrix.suffix }}.tar.gz"
          # Find the binary name from Cargo.toml (handles crate name != binary name)
          BIN=$(ls crates/${{ matrix.crate }}/target/${{ matrix.target }}/release/ \
            | grep -v '\.d$' | head -1) || true
          cd crates/${{ matrix.crate }}/target/${{ matrix.target }}/release
          tar czf "$GITHUB_WORKSPACE/$ARCHIVE" ${{ matrix.crate }}
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.crate }}-${{ matrix.suffix }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
