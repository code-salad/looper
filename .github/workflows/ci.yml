name: CI

on:
  push:
    branches: [alpha, main]
  pull_request:
    branches: [alpha, main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint all bash scripts
        run: |
          for script in plugins/looper/skills/looper/scripts/*; do
            [ -d "$script" ] && continue
            shellcheck "$script"
          done
          for script in plugins/looper/skills/looper/scripts/backends/*.sh; do
            shellcheck "$script"
          done

  validate:
    name: Validate structure
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin.json is valid JSON
        run: jq empty .claude-plugin/plugin.json

      - name: Validate marketplace.json is valid JSON
        run: jq empty .claude-plugin/marketplace.json

      - name: Check scripts are executable
        run: |
          status=0
          for script in plugins/looper/skills/looper/scripts/*; do
            [ -d "$script" ] && continue
            if [ ! -x "$script" ]; then
              echo "ERROR: $script is not executable"
              status=1
            fi
          done
          for script in plugins/looper/skills/looper/scripts/backends/*.sh; do
            if [ ! -x "$script" ]; then
              echo "ERROR: $script is not executable"
              status=1
            fi
          done
          exit $status

      - name: Check required files exist
        run: |
          status=0
          for file in plugins/looper/agents/planner.md \
                      plugins/looper/agents/doer.md \
                      plugins/looper/agents/checker.md \
                      plugins/looper/skills/looper/SKILL.md \
                      README.md; do
            if [ ! -f "$file" ]; then
              echo "ERROR: $file is missing"
              status=1
            fi
          done
          exit $status

  cargo-test:
    name: Cargo Test
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --workspace

  cargo-clippy:
    name: Cargo Clippy
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

  cargo-audit:
    name: Cargo Audit
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run audit
        run: cargo audit
