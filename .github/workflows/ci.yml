name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint all bash scripts
        run: |
          shellcheck plugins/looper/skills/loop/scripts/loop.sh
          for script in plugins/looper/skills/loop/scripts/detect-stack \
                        plugins/looper/skills/loop/scripts/run-tests \
                        plugins/looper/skills/loop/scripts/run-lint \
                        plugins/looper/skills/loop/scripts/run-typecheck \
                        plugins/looper/skills/loop/scripts/run-format \
                        plugins/looper/skills/loop/scripts/run-build \
                        plugins/looper/skills/loop/scripts/install-deps \
                        plugins/looper/skills/loop/scripts/security-scan \
                        plugins/looper/skills/loop/scripts/git-loop-context \
                        plugins/looper/skills/loop/scripts/git-commit-loop; do
            shellcheck "$script"
          done

  validate:
    name: Validate structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin.json is valid JSON
        run: jq empty .claude-plugin/plugin.json

      - name: Check scripts are executable
        run: |
          status=0
          for script in plugins/looper/skills/loop/scripts/*; do
            if [ ! -x "$script" ]; then
              echo "ERROR: $script is not executable"
              status=1
            fi
          done
          exit $status

      - name: Check required files exist
        run: |
          status=0
          for file in plugins/looper/agents/planner.md \
                      plugins/looper/agents/doer.md \
                      plugins/looper/agents/checker.md \
                      plugins/looper/skills/loop/SKILL.md \
                      README.md \
                      CLAUDE.md; do
            if [ ! -f "$file" ]; then
              echo "ERROR: $file is missing"
              status=1
            fi
          done
          exit $status
