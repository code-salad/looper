[package]
name = "mcp-server-rs"
version = "3.0.0"
edition = "2021"
description = "Fallback Agent MCP Server — Rust rewrite"

[[bin]]
name = "fallback-agent-rs"
path = "src/main.rs"

[dependencies]
rmcp = { version = "0.17.0", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
