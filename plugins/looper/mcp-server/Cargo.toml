[package]
name = "looper-watcher"
version = "0.1.0"
edition = "2021"
description = "Looper Watcher MCP Server — manages GitHub issue watchers"

[[bin]]
name = "looper-watcher"
path = "src/main.rs"

[dependencies]
rmcp = { version = "0.17.0", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
