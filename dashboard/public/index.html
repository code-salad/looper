<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Looper Dashboard</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ========== CSS RESET & VARIABLES ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
  --radius-sm: 4px; --radius-md: 6px; --radius-lg: 8px; --radius-xl: 12px;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px;
  --transition: 150ms ease-out;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
  --shadow-md: 0 4px 12px rgba(0,0,0,.1);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.15);
  --color-primary: #6366f1; --color-primary-hover: #5457e5;
  --color-plan: #3b82f6; --color-do: #a855f7; --color-check: #f97316;
  --color-pass: #22c55e; --color-fail: #ef4444;
  --color-critical: #ef4444; --color-high: #f97316; --color-medium: #eab308; --color-low: #6b7280;
}
[data-theme="dark"]{
  --bg-primary: #0f1117; --bg-secondary: #1a1d27; --bg-tertiary: #242736;
  --bg-hover: #2a2d3a; --bg-active: #32364a;
  --border-primary: #2a2d3a; --border-secondary: #363a4d;
  --text-primary: #e8eaed; --text-secondary: #9ca3af; --text-tertiary: #6b7280;
  --text-inverse: #0f1117;
  --shadow-color: rgba(0,0,0,.3);
}
[data-theme="light"]{
  --bg-primary: #f8f9fb; --bg-secondary: #ffffff; --bg-tertiary: #f1f3f5;
  --bg-hover: #e8ebee; --bg-active: #dde0e4;
  --border-primary: #e2e5ea; --border-secondary: #d0d4da;
  --text-primary: #1a1d27; --text-secondary: #6b7280; --text-tertiary: #9ca3af;
  --text-inverse: #ffffff;
  --shadow-color: rgba(0,0,0,.08);
}
html{font-size:14px} body{font-family:var(--font-sans);background:var(--bg-primary);color:var(--text-primary);line-height:1.5;overflow:hidden;height:100vh}
a{color:var(--color-primary);text-decoration:none} a:hover{text-decoration:underline}
button{font-family:var(--font-sans);cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,textarea,select{font-family:var(--font-sans);font-size:inherit;color:var(--text-primary);background:var(--bg-tertiary);border:1px solid var(--border-primary);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3);outline:none;transition:border-color var(--transition)}
input:focus,textarea:focus,select:focus{border-color:var(--color-primary)}
textarea{resize:vertical;min-height:80px}
::-webkit-scrollbar{width:6px;height:6px} ::-webkit-scrollbar-track{background:transparent} ::-webkit-scrollbar-thumb{background:var(--border-primary);border-radius:3px} ::-webkit-scrollbar-thumb:hover{background:var(--border-secondary)}

/* ========== LAYOUT ========== */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:240px;min-width:240px;background:var(--bg-secondary);border-right:1px solid var(--border-primary);display:flex;flex-direction:column;transition:width var(--transition),min-width var(--transition)}
.sidebar.collapsed{width:60px;min-width:60px}
.sidebar-header{padding:var(--space-5);display:flex;align-items:center;gap:var(--space-3);border-bottom:1px solid var(--border-primary)}
.sidebar-logo{width:32px;height:32px;background:var(--color-primary);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sidebar-logo svg{width:18px;height:18px;fill:white}
.sidebar-title{font-weight:700;font-size:1.1rem;white-space:nowrap;overflow:hidden}
.sidebar-version{font-size:.75rem;color:var(--text-tertiary);white-space:nowrap}
.sidebar.collapsed .sidebar-title,.sidebar.collapsed .sidebar-version,.sidebar.collapsed .nav-label,.sidebar.collapsed .nav-badge{display:none}
.sidebar-nav{flex:1;padding:var(--space-3);overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);color:var(--text-secondary);cursor:pointer;transition:all var(--transition);margin-bottom:2px;white-space:nowrap}
.nav-item:hover{background:var(--bg-hover);color:var(--text-primary)}
.nav-item.active{background:var(--color-primary);color:white}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.nav-badge{margin-left:auto;background:var(--bg-tertiary);color:var(--text-secondary);font-size:.7rem;padding:1px 6px;border-radius:10px;font-weight:600}
.nav-item.active .nav-badge{background:rgba(255,255,255,.2);color:white}
.sidebar-footer{padding:var(--space-3);border-top:1px solid var(--border-primary)}
.sidebar-toggle{display:flex;align-items:center;justify-content:center;width:100%;padding:var(--space-2);border-radius:var(--radius-sm);color:var(--text-tertiary)}
.sidebar-toggle:hover{background:var(--bg-hover);color:var(--text-primary)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.header{height:56px;min-height:56px;background:var(--bg-secondary);border-bottom:1px solid var(--border-primary);display:flex;align-items:center;padding:0 var(--space-5);gap:var(--space-4)}
.header-search{flex:1;max-width:480px;position:relative}
.header-search input{width:100%;padding-left:36px;background:var(--bg-tertiary);height:36px}
.header-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-tertiary)}
.header-search .kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:.7rem;color:var(--text-tertiary);background:var(--bg-secondary);border:1px solid var(--border-primary);padding:1px 5px;border-radius:3px;font-family:var(--font-mono)}
.header-actions{display:flex;align-items:center;gap:var(--space-2);margin-left:auto}
.icon-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);transition:background var(--transition)}
.icon-btn:hover{background:var(--bg-hover)}
.icon-btn svg{width:18px;height:18px}
.lang-toggle{font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:var(--radius-sm);border:1px solid var(--border-primary);background:var(--bg-tertiary)}
.lang-toggle:hover{background:var(--bg-hover)}
.content{flex:1;overflow:auto;padding:var(--space-5)}

/* ========== KANBAN ========== */
.kanban-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-5)}
.kanban-header h1{font-size:1.5rem;font-weight:700}
.kanban-actions{display:flex;gap:var(--space-2)}
.btn{padding:var(--space-2) var(--space-4);border-radius:var(--radius-sm);font-weight:500;font-size:.85rem;transition:all var(--transition);display:inline-flex;align-items:center;gap:var(--space-2)}
.btn-primary{background:var(--color-primary);color:white}
.btn-primary:hover{background:var(--color-primary-hover)}
.btn-secondary{background:var(--bg-tertiary);border:1px solid var(--border-primary)}
.btn-secondary:hover{background:var(--bg-hover)}
.btn-danger{background:var(--color-fail);color:white}
.btn-danger:hover{background:#dc2626}
.btn-sm{padding:var(--space-1) var(--space-3);font-size:.8rem}
.btn svg{width:16px;height:16px}
.kanban-board{display:flex;gap:var(--space-4);overflow-x:auto;height:calc(100vh - 170px);padding-bottom:var(--space-4)}
.kanban-column{min-width:280px;width:280px;background:var(--bg-secondary);border-radius:var(--radius-lg);border:1px solid var(--border-primary);display:flex;flex-direction:column;max-height:100%}
.column-header{padding:var(--space-3) var(--space-4);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-primary);flex-shrink:0}
.column-title{font-weight:600;font-size:.85rem;display:flex;align-items:center;gap:var(--space-2)}
.column-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.column-count{font-size:.75rem;color:var(--text-tertiary);background:var(--bg-tertiary);padding:1px 8px;border-radius:10px}
.column-body{flex:1;overflow-y:auto;padding:var(--space-2);min-height:60px}
.column-body.drag-over{background:var(--bg-tertiary);border-radius:0 0 var(--radius-lg) var(--radius-lg)}
.empty-column{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--space-8) var(--space-4);color:var(--text-tertiary);text-align:center;font-size:.85rem}
.empty-column svg{width:32px;height:32px;margin-bottom:var(--space-2);opacity:.4}

/* ========== TASK CARD ========== */
.task-card{background:var(--bg-tertiary);border:1px solid var(--border-primary);border-radius:var(--radius-md);padding:var(--space-3);margin-bottom:var(--space-2);cursor:grab;transition:all var(--transition);position:relative}
.task-card:hover{border-color:var(--border-secondary);box-shadow:var(--shadow-sm)}
.task-card.dragging{opacity:.5;transform:rotate(2deg)}
.task-card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:var(--space-2)}
.task-card-title{font-weight:600;font-size:.9rem;line-height:1.3;flex:1;margin-right:var(--space-2)}
.task-card-actions{display:flex;gap:2px;opacity:0;transition:opacity var(--transition)}
.task-card:hover .task-card-actions{opacity:1}
.task-card-actions button{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);color:var(--text-tertiary)}
.task-card-actions button:hover{background:var(--bg-hover);color:var(--text-primary)}
.task-card-actions button svg{width:14px;height:14px}
.task-card-desc{font-size:.8rem;color:var(--text-secondary);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:var(--space-2)}
.task-card-meta{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.priority-badge{font-size:.7rem;font-weight:600;padding:1px 6px;border-radius:3px;text-transform:uppercase}
.priority-critical{background:rgba(239,68,68,.15);color:var(--color-critical)}
.priority-high{background:rgba(249,115,22,.15);color:var(--color-high)}
.priority-medium{background:rgba(234,179,8,.15);color:var(--color-medium)}
.priority-low{background:rgba(107,114,128,.15);color:var(--color-low)}
.label-chip{font-size:.7rem;padding:1px 6px;border-radius:3px;background:rgba(99,102,241,.15);color:var(--color-primary)}
.loop-indicator{display:flex;align-items:center;gap:4px;font-size:.7rem;color:var(--text-tertiary);margin-left:auto}
.loop-indicator svg{width:12px;height:12px}
.verdict-badge{font-size:.65rem;font-weight:700;padding:1px 5px;border-radius:3px;text-transform:uppercase}
.verdict-pass{background:rgba(34,197,94,.15);color:var(--color-pass)}
.verdict-fail{background:rgba(239,68,68,.15);color:var(--color-fail)}

/* ========== MODAL ========== */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity var(--transition)}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal{background:var(--bg-secondary);border:1px solid var(--border-primary);border-radius:var(--radius-lg);width:560px;max-width:90vw;max-height:85vh;overflow:auto;box-shadow:var(--shadow-lg)}
.modal-header{padding:var(--space-5);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-primary)}
.modal-header h2{font-size:1.1rem;font-weight:700}
.modal-body{padding:var(--space-5)}
.modal-footer{padding:var(--space-4) var(--space-5);display:flex;justify-content:flex-end;gap:var(--space-2);border-top:1px solid var(--border-primary)}
.form-group{margin-bottom:var(--space-4)}
.form-group label{display:block;font-size:.85rem;font-weight:500;margin-bottom:var(--space-1);color:var(--text-secondary)}
.form-group input,.form-group textarea,.form-group select{width:100%}
.form-row{display:flex;gap:var(--space-3)}
.form-row .form-group{flex:1}
.form-tabs{display:flex;gap:var(--space-1);margin-bottom:var(--space-4);border-bottom:1px solid var(--border-primary);padding-bottom:var(--space-2)}
.form-tab{padding:var(--space-2) var(--space-4);border-radius:var(--radius-sm) var(--radius-sm) 0 0;font-size:.85rem;font-weight:500;color:var(--text-secondary)}
.form-tab.active{color:var(--color-primary);border-bottom:2px solid var(--color-primary);margin-bottom:-3px}
.form-tab:hover{color:var(--text-primary)}

/* ========== SIDE PANEL ========== */
.side-panel-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:900;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity var(--transition)}
.side-panel-overlay.active{opacity:1;pointer-events:auto}
.side-panel{position:fixed;top:0;right:-520px;width:520px;height:100vh;background:var(--bg-secondary);border-left:1px solid var(--border-primary);z-index:950;transition:right .25s ease-out;overflow-y:auto;box-shadow:var(--shadow-lg)}
.side-panel.active{right:0}
.side-panel-header{padding:var(--space-5);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-primary);position:sticky;top:0;background:var(--bg-secondary);z-index:10}
.side-panel-body{padding:var(--space-5)}
.detail-section{margin-bottom:var(--space-6)}
.detail-section h3{font-size:.9rem;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:var(--space-3)}
.detail-field{margin-bottom:var(--space-3)}
.detail-field label{font-size:.8rem;color:var(--text-tertiary);display:block;margin-bottom:var(--space-1)}
.detail-field .value{font-size:.9rem}
.detail-actions{display:flex;gap:var(--space-2);margin-bottom:var(--space-5)}

/* ========== TIMELINE ========== */
.timeline{position:relative;padding-left:28px}
.timeline::before{content:'';position:absolute;left:10px;top:8px;bottom:8px;width:2px;background:var(--border-primary)}
.timeline-item{position:relative;margin-bottom:var(--space-4);padding:var(--space-3);background:var(--bg-tertiary);border:1px solid var(--border-primary);border-radius:var(--radius-md)}
.timeline-dot{position:absolute;left:-22px;top:12px;width:10px;height:10px;border-radius:50%;border:2px solid var(--bg-secondary)}
.timeline-dot.plan{background:var(--color-plan)}
.timeline-dot.do{background:var(--color-do)}
.timeline-dot.check{background:var(--color-check)}
.timeline-phase{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:var(--space-1)}
.timeline-phase.plan{color:var(--color-plan)}
.timeline-phase.do{color:var(--color-do)}
.timeline-phase.check{color:var(--color-check)}
.timeline-subject{font-size:.85rem;font-weight:500;margin-bottom:var(--space-1)}
.timeline-body{font-size:.8rem;color:var(--text-secondary);font-family:var(--font-mono);white-space:pre-wrap;max-height:120px;overflow-y:auto;background:var(--bg-primary);padding:var(--space-2);border-radius:var(--radius-sm);margin-top:var(--space-2)}
.timeline-files{font-size:.75rem;color:var(--text-tertiary);margin-top:var(--space-2)}

/* ========== HISTORY VIEW ========== */
.history-table{width:100%;border-collapse:collapse}
.history-table th{text-align:left;padding:var(--space-3) var(--space-4);font-size:.8rem;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border-primary);position:sticky;top:0;background:var(--bg-secondary)}
.history-table td{padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--border-primary);font-size:.85rem}
.history-table tr:hover td{background:var(--bg-hover)}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:var(--space-2)}
.status-dot.passed{background:var(--color-pass)}
.status-dot.failed{background:var(--color-fail)}
.status-dot.in-progress{background:var(--color-medium)}

/* ========== ANALYTICS VIEW ========== */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--space-4);margin-bottom:var(--space-6)}
.stat-card{background:var(--bg-secondary);border:1px solid var(--border-primary);border-radius:var(--radius-md);padding:var(--space-5)}
.stat-card .stat-label{font-size:.8rem;color:var(--text-tertiary);margin-bottom:var(--space-1)}
.stat-card .stat-value{font-size:2rem;font-weight:700}
.stat-card .stat-sub{font-size:.8rem;color:var(--text-secondary);margin-top:var(--space-1)}
.chart-container{background:var(--bg-secondary);border:1px solid var(--border-primary);border-radius:var(--radius-md);padding:var(--space-5);margin-bottom:var(--space-4)}
.chart-container h3{font-size:1rem;font-weight:600;margin-bottom:var(--space-4)}
.bar-chart{display:flex;align-items:flex-end;gap:var(--space-3);height:200px;padding-top:var(--space-4)}
.bar{flex:1;background:var(--color-primary);border-radius:var(--radius-sm) var(--radius-sm) 0 0;min-height:4px;transition:height .3s ease;position:relative}
.bar-label{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);font-size:.7rem;color:var(--text-tertiary);white-space:nowrap}
.bar-value{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:.75rem;font-weight:600;color:var(--text-secondary)}
.donut-chart{width:160px;height:160px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;margin:0 auto}
.donut-center{font-size:1.8rem;font-weight:700}
.donut-label{font-size:.8rem;color:var(--text-tertiary);text-align:center;margin-top:var(--space-2)}

/* ========== SETTINGS VIEW ========== */
.settings-section{background:var(--bg-secondary);border:1px solid var(--border-primary);border-radius:var(--radius-md);padding:var(--space-5);margin-bottom:var(--space-4)}
.settings-section h3{font-size:1rem;font-weight:600;margin-bottom:var(--space-4);padding-bottom:var(--space-3);border-bottom:1px solid var(--border-primary)}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) 0;border-bottom:1px solid var(--border-primary)}
.settings-row:last-child{border-bottom:none}
.settings-row label{font-size:.9rem}
.settings-row .desc{font-size:.8rem;color:var(--text-tertiary)}
.toggle-switch{width:44px;height:24px;background:var(--bg-tertiary);border-radius:12px;position:relative;cursor:pointer;transition:background var(--transition);border:1px solid var(--border-primary)}
.toggle-switch.active{background:var(--color-primary);border-color:var(--color-primary)}
.toggle-switch::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:white;top:2px;left:2px;transition:transform var(--transition)}
.toggle-switch.active::after{transform:translateX(20px)}

/* ========== TOAST ========== */
.toast-container{position:fixed;top:var(--space-5);right:var(--space-5);z-index:2000;display:flex;flex-direction:column;gap:var(--space-2)}
.toast{padding:var(--space-3) var(--space-4);background:var(--bg-secondary);border:1px solid var(--border-primary);border-radius:var(--radius-md);box-shadow:var(--shadow-md);display:flex;align-items:center;gap:var(--space-3);animation:slideIn .2s ease-out;font-size:.85rem;max-width:400px}
.toast.success{border-left:3px solid var(--color-pass)}
.toast.error{border-left:3px solid var(--color-fail)}
.toast.info{border-left:3px solid var(--color-primary)}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(20px)}}

/* ========== COMMAND PALETTE ========== */
.cmd-palette-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:3000;display:flex;align-items:flex-start;justify-content:center;padding-top:20vh;opacity:0;pointer-events:none;transition:opacity var(--transition)}
.cmd-palette-overlay.active{opacity:1;pointer-events:auto}
.cmd-palette{width:560px;max-width:90vw;background:var(--bg-secondary);border:1px solid var(--border-primary);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);overflow:hidden}
.cmd-palette input{width:100%;border:none;border-bottom:1px solid var(--border-primary);border-radius:0;padding:var(--space-4) var(--space-5);font-size:1rem;background:transparent}
.cmd-palette-results{max-height:300px;overflow-y:auto}
.cmd-result{padding:var(--space-3) var(--space-5);display:flex;align-items:center;gap:var(--space-3);cursor:pointer;font-size:.9rem}
.cmd-result:hover,.cmd-result.selected{background:var(--bg-hover)}
.cmd-result svg{width:16px;height:16px;color:var(--text-tertiary)}

/* ========== PM AGENT PANEL ========== */
.pm-subtasks{margin-top:var(--space-4)}
.pm-subtask{background:var(--bg-tertiary);border:1px solid var(--border-primary);border-radius:var(--radius-md);padding:var(--space-3);margin-bottom:var(--space-2);display:flex;align-items:flex-start;gap:var(--space-3)}
.pm-subtask input[type=checkbox]{margin-top:4px;accent-color:var(--color-primary)}
.pm-subtask-content{flex:1}
.pm-subtask-title{font-weight:600;font-size:.9rem;margin-bottom:2px}
.pm-subtask-desc{font-size:.8rem;color:var(--text-secondary)}
.pm-loading{text-align:center;padding:var(--space-8);color:var(--text-tertiary)}
.pm-loading .spinner{width:32px;height:32px;border:3px solid var(--border-primary);border-top-color:var(--color-primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto var(--space-3)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ========== CONFIRM DIALOG ========== */
.confirm-dialog .modal{width:400px}
.confirm-dialog .modal-body{text-align:center;padding:var(--space-8) var(--space-5)}
.confirm-dialog .confirm-icon{width:48px;height:48px;margin:0 auto var(--space-4);background:rgba(239,68,68,.1);border-radius:50%;display:flex;align-items:center;justify-content:center}
.confirm-dialog .confirm-icon svg{width:24px;height:24px;color:var(--color-fail)}

/* ========== SKELETON ========== */
.skeleton{background:linear-gradient(90deg,var(--bg-tertiary) 25%,var(--bg-hover) 50%,var(--bg-tertiary) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--radius-sm)}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skeleton-card{height:120px;margin-bottom:var(--space-2);border-radius:var(--radius-md)}
.skeleton-text{height:14px;margin-bottom:var(--space-2);width:80%}
.skeleton-text.short{width:40%}

/* ========== ONBOARDING ========== */
.onboarding-tooltip{position:absolute;background:var(--color-primary);color:white;padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);font-size:.85rem;z-index:4000;max-width:280px;box-shadow:var(--shadow-lg)}
.onboarding-tooltip::after{content:'';position:absolute;border:6px solid transparent}
.onboarding-tooltip.bottom::after{top:-12px;left:20px;border-bottom-color:var(--color-primary)}
.onboarding-tooltip .dismiss{float:right;opacity:.7;cursor:pointer;margin-left:var(--space-2)}
.onboarding-tooltip .dismiss:hover{opacity:1}

/* ========== RESPONSIVE ========== */
@media(max-width:1024px){
  .sidebar{width:60px;min-width:60px}
  .sidebar .sidebar-title,.sidebar .sidebar-version,.sidebar .nav-label,.sidebar .nav-badge{display:none}
  .kanban-column{min-width:240px;width:240px}
  .side-panel{width:100vw}
}

function t(key) { return (i18n[State.lang] || i18n.en)[key] || key; }

/* ========== API ========== */
const API = {
  async get(url) { const r = await fetch(url); return r.json(); },
  async post(url, data) { const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }); return r.json(); },
  async put(url, data) { const r = await fetch(url, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }); return r.json(); },
  async del(url) { const r = await fetch(url, { method: 'DELETE' }); return r.json(); }
};

async function loadTasks() { State.tasks = await API.get('/api/tasks'); }
async function loadLoops() { State.loops = await API.get('/api/git/loops'); }
async function loadStats() { State.stats = await API.get('/api/stats'); }

async function refreshAll() {
  await Promise.all([loadTasks(), loadLoops(), loadStats()]);
  renderCurrentView();
  showToast(State.lang === 'ko' ? '새로고침 완료' : 'Refreshed', 'info');
}

/* ========== WEBSOCKET ========== */
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  State.ws = new WebSocket(`${proto}//${location.host}`);
  State.ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'task:created' || msg.type === 'task:updated') {
      const idx = State.tasks.findIndex(t => t.id === msg.data.id);
      if (idx >= 0) State.tasks[idx] = msg.data; else State.tasks.push(msg.data);
      if (State.currentView === 'kanban') renderKanban();
    } else if (msg.type === 'task:deleted') {
      State.tasks = State.tasks.filter(t => t.id !== msg.data.id);
      if (State.currentView === 'kanban') renderKanban();
    } else if (msg.type === 'loop:log') {
      const panel = document.getElementById('loopLogContent');
      if (panel) { panel.textContent += msg.data.message; panel.scrollTop = panel.scrollHeight; }
    }
  };
  State.ws.onclose = () => setTimeout(connectWS, 3000);
}

/* ========== RENDERING ========== */
function switchView(view) {

  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.view === view));
  document.querySelectorAll('.view').forEach(el => { el.style.display = el.id === `view-${view}` ? '' : 'none'; });

function renderCurrentView() {

/* ========== KANBAN ========== */
function renderKanban() {
  const emptyKeys = { 'backlog': 'empty.backlog', 'planning': 'empty.planning', 'in-progress': 'empty.inProgress', 'review': 'empty.review', 'done': 'empty.done' };
  let html = `<div class="kanban-header"><h1 data-i18n="kanban.title">${t('kanban.title')}</h1><div class="kanban-actions"><button class="btn btn-primary" onclick="openModal('newTaskModal')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span data-i18n="btn.newTask">${t('btn.newTask')}</span></button></div></div>`;
  html += '<div class="kanban-board">';
  for (const col of COLUMNS) {
    const tasks = State.tasks.filter(t => t.column === col.id);
    html += `<div class="kanban-column" data-column="${col.id}"><div class="column-header"><div class="column-title"><span class="column-dot" style="background:${col.color}"></span>${col.label[State.lang] || col.label.en}</div><span class="column-count">${tasks.length}</span></div>`;
    html += `<div class="column-body" ondragover="onDragOver(event)" ondrop="onDrop(event,'${col.id}')" ondragleave="onDragLeave(event)">`;
    if (tasks.length === 0) {
      html += `<div class="empty-column"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg><span data-i18n="${emptyKeys[col.id]}">${t(emptyKeys[col.id])}</span></div>`;
    } else {
      for (const task of tasks) { html += renderTaskCard(task); }
    }
    html += '</div></div>';
  }
  html += '</div>';
  document.getElementById('view-kanban').innerHTML = html;
}

function renderTaskCard(task) {
  const priorityClass = `priority-${task.priority}`;
  const labels = (task.labels || []).map(l => `<span class="label-chip">${esc(l)}</span>`).join('');
  let loopHtml = '';
  if (task.loopStatus === 'running') {
    loopHtml = `<span class="loop-indicator"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Running</span>`;
  } else if (task.loopVerdict) {
    const vc = task.loopVerdict === 'PASS' ? 'verdict-pass' : 'verdict-fail';
    loopHtml = `<span class="verdict-badge ${vc}">${task.loopVerdict}</span>`;
  }
  if (task.loopIterations > 0) {
    loopHtml += `<span class="loop-indicator"><svg viewBox="0 0 24 24" fill="currentColor" width="12" height="12"><path d="M12 4V2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10h-2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8v2l4-3-4-3z"/></svg> ${task.loopIterations}</span>`;
  }
  return `<div class="task-card" draggable="true" ondragstart="onDragStart(event,'${task.id}')" onclick="openTaskDetail('${task.id}')">
    <div class="task-card-header">
      <div class="task-card-title">${esc(task.title)}</div>
      <div class="task-card-actions">
        <button onclick="event.stopPropagation();openEditTask('${task.id}')" title="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
        <button onclick="event.stopPropagation();confirmDeleteTask('${task.id}')" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button>
      </div>
    </div>
    ${task.description ? `<div class="task-card-desc">${esc(task.description)}</div>` : ''}
    <div class="task-card-meta"><span class="priority-badge ${priorityClass}">${task.priority}</span>${labels}${loopHtml}</div>
  </div>`;
}

/* ========== DRAG & DROP ========== */
let draggedTaskId = null;
function onDragStart(e, id) { draggedTaskId = id; e.target.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; }
function onDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function onDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
async function onDrop(e, column) {
  e.preventDefault(); e.currentTarget.classList.remove('drag-over');
  if (!draggedTaskId) return;
  await API.put(`/api/tasks/${draggedTaskId}`, { column });
  const idx = State.tasks.findIndex(t => t.id === draggedTaskId);
  if (idx >= 0) State.tasks[idx].column = column;
  draggedTaskId = null;
  document.querySelectorAll('.task-card.dragging').forEach(el => el.classList.remove('dragging'));
  renderKanban();
  showToast(t('toast.updated'), 'success');
}

/* ========== HISTORY VIEW ========== */

  let html = `<div class="kanban-header"><h1 data-i18n="history.title">${t('history.title')}</h1><div class="kanban-actions"><button class="btn btn-secondary" onclick="loadLoops().then(renderHistory)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> Refresh</button></div></div>`;
  if (State.loops.length === 0) {
    html += `<div class="empty-column" style="padding:60px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><p style="margin-top:12px">${State.lang === 'ko' ? '루프 히스토리가 없습니다.' : 'No loop history found.'}</p></div>`;
  } else {
    html += '<div style="background:var(--bg-secondary);border:1px solid var(--border-primary);border-radius:var(--radius-lg);overflow:hidden"><table class="history-table"><thead><tr>';
    html += `<th data-i18n="history.task">${t('history.task')}</th><th data-i18n="history.status">${t('history.status')}</th><th data-i18n="history.iterations">${t('history.iterations')}</th><th data-i18n="history.lastActivity">${t('history.lastActivity')}</th>`;
    html += '</tr></thead><tbody>';
    for (const loop of State.loops) {
      const statusClass = loop.status;
      const statusLabel = loop.status === 'passed' ? 'PASS' : loop.status === 'failed' ? 'FAIL' : 'Running';
      html += `<tr style="cursor:pointer" onclick="openLoopDetail('${esc(loop.taskName)}')"><td><strong>${esc(loop.taskName)}</strong></td><td><span class="status-dot ${statusClass}"></span>${statusLabel}</td><td>${loop.totalIterations}</td><td>${formatDate(loop.lastActivity)}</td></tr>`;

/* ========== ANALYTICS VIEW ========== */
function renderAnalytics() {
  const s = State.stats;
  let html = `<div class="kanban-header"><h1 data-i18n="analytics.title">${t('analytics.title')}</h1></div>`;
  html += '<div class="stats-grid">';
  html += statCard(t('analytics.total'), s.totalTasks || 0, '', 'var(--color-primary)');
  html += statCard(t('analytics.passed'), s.passed || 0, '', 'var(--color-pass)');
  html += statCard(t('analytics.failed'), s.failed || 0, '', 'var(--color-fail)');
  html += statCard(t('analytics.inProgress'), s.inProgress || 0, '', 'var(--color-medium)');
  html += statCard(t('analytics.avgIter'), s.avgIterations || 0, State.lang === 'ko' ? '회 평균' : 'avg per loop', 'var(--color-do)');
  html += statCard(t('analytics.passRate'), (s.passRate || 0) + '%', '', 'var(--color-pass)');
  html += '</div>';

  // Distribution chart
  const cols = s.tasksByColumn || {};
  html += `<div class="chart-container"><h3 data-i18n="analytics.distribution">${t('analytics.distribution')}</h3><div class="bar-chart">`;
  const maxVal = Math.max(1, ...Object.values(cols));
  for (const col of COLUMNS) {
    const val = cols[col.id] || 0;
    const h = (val / maxVal) * 180;
    html += `<div class="bar" style="height:${h}px;background:${col.color}"><span class="bar-value">${val}</span><span class="bar-label">${col.label[State.lang] || col.label.en}</span></div>`;
  }
  html += '</div></div>';
  document.getElementById('view-analytics').innerHTML = html;
}

function statCard(label, value, sub, color) {
  return `<div class="stat-card"><div class="stat-label">${label}</div><div class="stat-value" style="color:${color}">${value}</div>${sub ? `<div class="stat-sub">${sub}</div>` : ''}</div>`;
}

/* ========== TASK CRUD ========== */
function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

async function saveNewTask() {
  const tab = document.getElementById('tab-pm-agent').style.display !== 'none' ? 'pm' : 'manual';
  if (tab === 'pm' && State.pmSubtasks.length > 0) {
    // Add all checked PM subtasks
    const checks = document.querySelectorAll('#pmResults input[type=checkbox]:checked');
    for (const cb of checks) {
      const idx = parseInt(cb.dataset.idx);
      const sub = State.pmSubtasks[idx];
      if (sub) await API.post('/api/tasks', { title: sub.title, description: sub.description, priority: sub.priority });
    }
    State.pmSubtasks = [];
  } else {
    const title = document.getElementById('taskTitle').value.trim();
    if (!title) return showToast('Title is required', 'error');
    await API.post('/api/tasks', {
      title,
      description: document.getElementById('taskDesc').value.trim(),
      priority: document.getElementById('taskPriority').value,
      labels: document.getElementById('taskLabels').value.split(',').map(s => s.trim()).filter(Boolean)
    });
  }
  closeModal('newTaskModal');
  document.getElementById('taskTitle').value = '';
  document.getElementById('taskDesc').value = '';
  document.getElementById('taskLabels').value = '';
  await loadTasks(); renderKanban();
  showToast(t('toast.created'), 'success');
}

function openEditTask(id) {
  const task = State.tasks.find(t => t.id === id);
  if (!task) return;
  State.editingTaskId = id;
  document.getElementById('editTitle').value = task.title;
  document.getElementById('editDesc').value = task.description || '';
  document.getElementById('editPriority').value = task.priority;
  document.getElementById('editColumn').value = task.column;
  document.getElementById('editLabels').value = (task.labels || []).join(', ');
  openModal('editTaskModal');
}

async function saveEditTask() {
  if (!State.editingTaskId) return;
  await API.put(`/api/tasks/${State.editingTaskId}`, {
    title: document.getElementById('editTitle').value.trim(),
    description: document.getElementById('editDesc').value.trim(),
    priority: document.getElementById('editPriority').value,
    column: document.getElementById('editColumn').value,
    labels: document.getElementById('editLabels').value.split(',').map(s => s.trim()).filter(Boolean)
  });
  closeModal('editTaskModal');
  State.editingTaskId = null;
  await loadTasks(); renderKanban();
  showToast(t('toast.updated'), 'success');
}

function confirmDeleteTask(id) {
  document.getElementById('confirmMessage').textContent = t('confirm.delete');
  document.getElementById('confirmAction').onclick = async () => {
    await API.del(`/api/tasks/${id}`);
    closeModal('confirmDialog');
    closeSidePanel();
    await loadTasks(); renderKanban();
    showToast(t('toast.deleted'), 'success');
  };
  openModal('confirmDialog');
}

/* ========== PM AGENT ========== */
async function decomposePM() {
  const prompt = document.getElementById('pmPrompt').value.trim();
  if (!prompt) return showToast('Prompt is required', 'error');
  const btn = document.getElementById('decomposeBtn');
  btn.disabled = true;
  document.getElementById('pmResults').innerHTML = `<div class="pm-loading"><div class="spinner"></div><p data-i18n="toast.decomposing">${t('toast.decomposing')}</p></div>`;
  showToast(t('toast.decomposing'), 'info');
  try {
    const res = await API.post('/api/pm/decompose', { prompt });
    State.pmSubtasks = res.subtasks || [];
    let html = '<div class="pm-subtasks">';
    State.pmSubtasks.forEach((sub, i) => {
      html += `<div class="pm-subtask"><input type="checkbox" checked data-idx="${i}"><div class="pm-subtask-content"><div class="pm-subtask-title">${esc(sub.title)}</div><div class="pm-subtask-desc">${esc(sub.description)}</div><span class="priority-badge priority-${sub.priority}">${sub.priority}</span></div></div>`;
    });
    html += `</div><div style="margin-top:12px;text-align:right"><button class="btn btn-primary" onclick="saveNewTask()" data-i18n="btn.addAll">${t('btn.addAll')}</button></div>`;
    document.getElementById('pmResults').innerHTML = html;
    showToast(t('toast.decomposed'), 'success');
  } catch (e) {
    document.getElementById('pmResults').innerHTML = `<div class="pm-loading" style="color:var(--color-fail)">${esc(e.message || 'Error')}</div>`;
    showToast('Error: ' + (e.message || 'Unknown'), 'error');
  }
  btn.disabled = false;
}

function switchFormTab(el, tab) {
  document.querySelectorAll('.form-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-manual').style.display = tab === 'manual' ? '' : 'none';
  document.getElementById('tab-pm-agent').style.display = tab === 'pm-agent' ? '' : 'none';
}

/* ========== TASK DETAIL SIDE PANEL ========== */
function openTaskDetail(id) {
  const task = State.tasks.find(t => t.id === id);
  if (!task) return;
  document.getElementById('sidePanelTitle').textContent = task.title;
  let html = '';

  // Detail actions
  html += '<div class="detail-actions">';
  if (task.loopStatus === 'running') {
    html += `<button class="btn btn-danger btn-sm" onclick="stopTaskLoop('${id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><rect x="6" y="6" width="12" height="12"/></svg> ${t('btn.stopLoop')}</button>`;
  } else {
    html += `<button class="btn btn-primary btn-sm" onclick="startTaskLoop('${id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polygon points="5 3 19 12 5 21 5 3"/></svg> ${t('btn.startLoop')}</button>`;
  }
  html += `<button class="btn btn-secondary btn-sm" onclick="openEditTask('${id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> ${State.lang === 'ko' ? '편집' : 'Edit'}</button>`;
  html += `<button class="btn btn-danger btn-sm" onclick="confirmDeleteTask('${id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg> ${State.lang === 'ko' ? '삭제' : 'Delete'}</button>`;
  html += '</div>';

  // Info
  html += `<div class="detail-section"><h3>${t('detail.info')}</h3>`;
  html += `<div class="detail-field"><label>${t('form.description')}</label><div class="value">${esc(task.description) || '<span style="color:var(--text-tertiary)">—</span>'}</div></div>`;
  html += `<div class="detail-field"><label>${t('form.priority')}</label><div class="value"><span class="priority-badge priority-${task.priority}">${task.priority}</span></div></div>`;
  html += `<div class="detail-field"><label>${t('form.labels')}</label><div class="value">${(task.labels||[]).map(l=>`<span class="label-chip">${esc(l)}</span>`).join(' ') || '—'}</div></div>`;
  html += `<div class="detail-field"><label>${State.lang === 'ko' ? '생성일' : 'Created'}</label><div class="value">${formatDate(task.createdAt)}</div></div>`;
  html += '</div>';

  // Loop Status
  if (task.loopStatus) {
    html += `<div class="detail-section"><h3>${t('detail.loop')}</h3>`;
    html += `<div class="detail-field"><label>Status</label><div class="value">${task.loopStatus}</div></div>`;
    if (task.loopIterations) html += `<div class="detail-field"><label>Iterations</label><div class="value">${task.loopIterations}</div></div>`;
    if (task.loopVerdict) html += `<div class="detail-field"><label>Verdict</label><div class="value"><span class="verdict-badge ${task.loopVerdict === 'PASS' ? 'verdict-pass' : 'verdict-fail'}">${task.loopVerdict}</span></div></div>`;
    html += '</div>';
  }

  // Live log
  if (task.loopStatus === 'running') {
    html += `<div class="detail-section"><h3>${State.lang === 'ko' ? '에이전트 로그' : 'Agent Log'}</h3><div id="loopLogContent" class="timeline-body" style="max-height:200px;min-height:60px"></div></div>`;
  }

  // Find matching loop from git
  const loop = State.loops.find(l => l.taskName === task.loopTaskName);
  if (loop && loop.iterations.length > 0) {
    html += `<div class="detail-section"><h3>${t('detail.timeline')}</h3><div class="timeline">`;
    for (const iter of loop.iterations) {
      if (iter.plan) html += timelineItem('plan', iter.plan);
      if (iter.do) html += timelineItem('do', iter.do);
      if (iter.check) html += timelineItem('check', iter.check);
    }
    html += '</div></div>';
  }

  document.getElementById('sidePanelBody').innerHTML = html;
  document.getElementById('sidePanelOverlay').classList.add('active');
  document.getElementById('sidePanel').classList.add('active');
}

function timelineItem(phase, commit) {
  const label = phase === 'plan' ? 'Plan' : phase === 'do' ? 'Do' : 'Check';
  let extra = '';
  if (commit.verdict) extra = `<span class="verdict-badge ${commit.verdict === 'PASS' ? 'verdict-pass' : 'verdict-fail'}">${commit.verdict}</span>`;
  if (commit.filesChanged && commit.filesChanged.length) {
    extra += `<div class="timeline-files">${commit.filesChanged.length} file(s) changed</div>`;
  }
  return `<div class="timeline-item"><div class="timeline-dot ${phase}"></div><div class="timeline-phase ${phase}">${label}</div><div class="timeline-subject">${esc(commit.subject)}</div>${commit.body ? `<div class="timeline-body">${esc(commit.body)}</div>` : ''}${extra}</div>`;
}

function closeSidePanel() {
  document.getElementById('sidePanelOverlay').classList.remove('active');
  document.getElementById('sidePanel').classList.remove('active');
}

function openLoopDetail(taskName) {
  const loop = State.loops.find(l => l.taskName === taskName);
  if (!loop) return;
  document.getElementById('sidePanelTitle').textContent = taskName;
  let html = `<div class="detail-section"><h3>Status</h3><p><span class="status-dot ${loop.status}"></span> ${loop.status.toUpperCase()} — ${loop.totalIterations} iteration(s)</p></div>`;
  html += `<div class="detail-section"><h3>${t('detail.timeline')}</h3><div class="timeline">`;
  for (const iter of loop.iterations) {
    if (iter.plan) html += timelineItem('plan', iter.plan);
    if (iter.do) html += timelineItem('do', iter.do);
    if (iter.check) html += timelineItem('check', iter.check);
  }
  html += '</div></div>';
  document.getElementById('sidePanelBody').innerHTML = html;
  document.getElementById('sidePanelOverlay').classList.add('active');
  document.getElementById('sidePanel').classList.add('active');
}

/* ========== LOOP ACTIONS ========== */
async function startTaskLoop(id) {
  try {
    await API.post(`/api/tasks/${id}/start-loop`);
    await loadTasks(); renderKanban();
    showToast(t('toast.loopStarted'), 'success');
  } catch (e) { showToast('Error: ' + (e.message || 'Unknown'), 'error'); }
}

async function stopTaskLoop(id) {
  try {
    await API.post(`/api/tasks/${id}/stop-loop`);
    await loadTasks(); renderKanban();
    showToast(t('toast.loopStopped'), 'info');
  } catch (e) { showToast('Error: ' + (e.message || 'Unknown'), 'error'); }
}

/* ========== COMMAND PALETTE ========== */
function openCmdPalette() {
  document.getElementById('cmdPalette').classList.add('active');
  const inp = document.getElementById('cmdInput');
  inp.value = '';
  inp.focus();
  renderCmdResults('');
}
function closeCmdPalette() { document.getElementById('cmdPalette').classList.remove('active'); }

const CMD_ACTIONS = [
  { label: { en: 'New Task', ko: '새 태스크' }, icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>', action: () => { closeCmdPalette(); openModal('newTaskModal'); } },
  { label: { en: 'Go to Kanban', ko: '칸반으로 이동' }, icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>', action: () => { closeCmdPalette(); switchView('kanban'); } },
  { label: { en: 'Go to History', ko: '히스토리로 이동' }, icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>', action: () => { closeCmdPalette(); switchView('history'); } },
  { label: { en: 'Go to Analytics', ko: '분석으로 이동' }, icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>', action: () => { closeCmdPalette(); switchView('analytics'); } },
  { label: { en: 'Go to Settings', ko: '설정으로 이동' }, icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>', action: () => { closeCmdPalette(); switchView('settings'); } },
  { label: { en: 'Toggle Theme', ko: '테마 전환' }, icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/></svg>', action: () => { closeCmdPalette(); toggleTheme(); } },
  { label: { en: 'Toggle Language', ko: '언어 전환' }, icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>', action: () => { closeCmdPalette(); toggleLang(); } },
  { label: { en: 'Refresh All', ko: '새로고침' }, icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>', action: () => { closeCmdPalette(); refreshAll(); } },
];

let cmdSelectedIdx = 0;
function renderCmdResults(q) {
  const results = q ? CMD_ACTIONS.filter(a => {
    const label = (a.label[State.lang] || a.label.en).toLowerCase();
    return label.includes(q.toLowerCase());
  }) : CMD_ACTIONS;
  // Also search tasks
  const matchingTasks = q ? State.tasks.filter(t => t.title.toLowerCase().includes(q.toLowerCase())).slice(0, 5) : [];
  let html = '';
  results.forEach((r, i) => {
    const label = r.label[State.lang] || r.label.en;
    html += `<div class="cmd-result ${i === cmdSelectedIdx ? 'selected' : ''}" onclick="CMD_ACTIONS[${CMD_ACTIONS.indexOf(r)}].action()" data-idx="${i}">${r.icon}<span>${esc(label)}</span></div>`;
  });
  if (matchingTasks.length) {
    html += `<div style="padding:4px 20px;font-size:.75rem;color:var(--text-tertiary);border-top:1px solid var(--border-primary);margin-top:4px;padding-top:8px">${State.lang === 'ko' ? '태스크' : 'Tasks'}</div>`;
    matchingTasks.forEach(task => {
      html += `<div class="cmd-result" onclick="closeCmdPalette();openTaskDetail('${task.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="15"/></svg><span>${esc(task.title)}</span></div>`;
    });
  }
  document.getElementById('cmdResults').innerHTML = html;
  cmdSelectedIdx = 0;
}

function handleCmdInput(e) { cmdSelectedIdx = 0; renderCmdResults(e.target.value); }
function handleCmdKeydown(e) {
  const items = document.querySelectorAll('.cmd-result');
  if (e.key === 'Escape') { closeCmdPalette(); return; }
  if (e.key === 'ArrowDown') { e.preventDefault(); cmdSelectedIdx = Math.min(cmdSelectedIdx + 1, items.length - 1); items.forEach((el, i) => el.classList.toggle('selected', i === cmdSelectedIdx)); }
  if (e.key === 'ArrowUp') { e.preventDefault(); cmdSelectedIdx = Math.max(cmdSelectedIdx - 1, 0); items.forEach((el, i) => el.classList.toggle('selected', i === cmdSelectedIdx)); }
  if (e.key === 'Enter') { items[cmdSelectedIdx]?.click(); }
}

/* ========== THEME & LANG ========== */
function toggleTheme() {
  State.theme = State.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = State.theme;
  localStorage.setItem('looper-theme', State.theme);
  if (State.currentView === 'settings') renderSettings();
}

function toggleLang() {
  State.lang = State.lang === 'en' ? 'ko' : 'en';
  document.documentElement.lang = State.lang;
  document.getElementById('langToggle').textContent = State.lang.toUpperCase();
  localStorage.setItem('looper-lang', State.lang);
  renderCurrentView();
}

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    const val = t(key);
    if (val !== key) el.textContent = val;
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.dataset.i18nPlaceholder;
    const val = t(key) || (i18n.en[key]);
    if (val) el.placeholder = val;
  });
}

/* ========== TOAST ========== */
function showToast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => { toast.style.animation = 'slideOut .2s ease-out forwards'; setTimeout(() => toast.remove(), 200); }, 3000);
}

/* ========== UTILS ========== */
function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function formatDate(iso) { if (!iso) return '—'; try { return new Date(iso).toLocaleDateString(State.lang === 'ko' ? 'ko-KR' : 'en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch { return iso; } }

function handleGlobalSearch(e) {
  if (e.key === 'Escape') { e.target.value = ''; renderKanban(); return; }
  // Filter kanban by search
  // This is handled by re-rendering since tasks are already loaded
}

function exportTasks() {
  const blob = new Blob([JSON.stringify(State.tasks, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'looper-tasks.json'; a.click();
  URL.revokeObjectURL(url);
  showToast(State.lang === 'ko' ? '내보내기 완료' : 'Exported', 'success');
}

async function resetData() {
  if (!confirm(State.lang === 'ko' ? '정말 모든 데이터를 삭제하시겠습니까?' : 'Are you sure you want to delete all data?')) return;
  for (const task of State.tasks) { await API.del(`/api/tasks/${task.id}`); }
  await loadTasks(); renderCurrentView();
  showToast(State.lang === 'ko' ? '초기화 완료' : 'Reset complete', 'success');
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}

/* ========== KEYBOARD SHORTCUTS ========== */
document.addEventListener('keydown', (e) => {
  // Ctrl+K: Command palette
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); openCmdPalette(); return; }
  // Escape: Close modals/panels
  if (e.key === 'Escape') {
    if (document.getElementById('cmdPalette').classList.contains('active')) { closeCmdPalette(); return; }
    document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
    closeSidePanel();
    return;
  }
  // N: New task (when no input focused)
  if (e.key === 'n' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
    e.preventDefault(); openModal('newTaskModal'); return;
  }
});

/* ========== ONBOARDING ========== */
function showOnboarding() {
  if (State.onboardingDone) return;
  const tip = document.createElement('div');
  tip.className = 'onboarding-tooltip bottom';
  tip.style.cssText = 'top:70px;left:260px;';
  tip.innerHTML = `${t('onboarding.welcome')}<span class="dismiss" onclick="this.parentElement.remove();localStorage.setItem('looper-onboarding','true')">✕</span>`;
  document.body.appendChild(tip);
  setTimeout(() => tip.remove(), 10000);
}

/* ========== INIT ========== */
async function init() {
  document.documentElement.dataset.theme = State.theme;
  document.documentElement.lang = State.lang;
  document.getElementById('langToggle').textContent = State.lang.toUpperCase();
  connectWS();
  await Promise.all([loadTasks(), loadLoops(), loadStats()]);
  renderCurrentView();
  showOnboarding();
}

init();
</script>
